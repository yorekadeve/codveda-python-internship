<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}ScamShield UG{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    form input[type=text], form input[type=email], form input[type=password] {
      display: block; width: 100%; padding: .5rem .75rem;
      border: 1px solid #ced4da; border-radius: .375rem;
    }
    .helptext, form ul { font-size: .85rem; color: #6c757d; }
    form ul.errorlist { color: #dc3545; list-style: none; padding-left: 0; margin: .25rem 0 0; }
  </style>
</head>
<body class="bg-light">
  <nav class="navbar navbar-expand navbar-dark bg-dark mb-4">
    <div class="container">
      <a class="navbar-brand" href="{% url 'home' %}">ScamShield UG</a>
      <div class="d-flex align-items-center gap-2">
        {% if user.is_authenticated %}
          <span class="text-light small">Hi, {{ user.username }}</span>
          <form method="post" action="{% url 'logout' %}" class="d-inline">
            {% csrf_token %}
            <button class="btn btn-outline-light btn-sm">Log out</button>
          </form>
        {% else %}
          <a class="btn btn-outline-light btn-sm" href="{% url 'login' %}">Log in</a>
          <a class="btn btn-warning btn-sm" href="{% url 'register' %}">Register</a>
        {% endif %}
      </div>
    </div>
  </nav>

  <main class="container">
    {% for message in messages %}
      <div class="alert alert-{{ message.tags }}">{{ message }}</div>
    {% endfor %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
